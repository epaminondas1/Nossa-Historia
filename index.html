<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa História de Amor ❤️</title>
    <style>
        :root {
            --cor-fundo: #fff0f3;
            --cor-primaria: #ff4d6d;
            --cor-secundaria: #ff758f;
            --cor-texto: #590d22;
            --cor-card: #ffffff;
        }

        body {
            background-color: var(--cor-fundo);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--cor-texto);
            margin: 0;
            padding: 0 15px; /* Respiro nas laterais para celular */
            box-sizing: border-box;
            text-align: center;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--cor-primaria), var(--cor-secundaria));
            padding: 40px 20px;
            color: white;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: 20px;
        }

        img, video {
            max-width: 100%; /* Garante que nada passe do tamanho da tela */
            height: auto;
            border-radius: 15px;
            margin: 10px 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Nossa História de Amor ❤️</h1>
    </header>

    <div class="container">
        <!-- Substitua os nomes abaixo pelos nomes exatos dos seus arquivos -->
        <img src="WhatsApp Image 2026-06-05 at 14.00.01.jpeg" alt="Nossa foto">
        
        <p>Bem-vindos à nossa história!</p>
        
        <video controls>
            <source src="parque.mp4" type="video/mp4">
        </video>
        
        <audio controls>
            <source src="musica.mp3" type="audio/mpeg">
        </audio>
    </div>

</body>
</html>
